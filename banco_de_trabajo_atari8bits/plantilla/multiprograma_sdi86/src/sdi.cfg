# SDI '86 · ld65 (todos los programas)
# $2000-$9FFF programa, datos y variables (HIBSS va detrás, sin ocupar fichero)
# $A000-$BFFF RAM de trabajo de cada programa (PMG, pantallas)
MEMORY {
    ZP:   start = $0080, size = $0080, type = rw, define = yes;
    INIT: start = $0600, size = $0100, type = rw, file = "build/init.bin";
    MAIN: start = $2000, size = $8000, type = rw, file = %O;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    INITSEG:  load = INIT, type = rw;
    CODE:     load = MAIN, type = rw;
    HIBSS:    load = MAIN, type = bss, define = yes;
}
