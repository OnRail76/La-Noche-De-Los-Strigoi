# La Noche de los Strigoi · ld65
# $2000-$21FF fuente (residente) · $2200-$3FFF zona de tramo/arena (superpuestos,
# cada uno a su fichero; se guardan comprimidos bajo el OS) · $4000- programa
MEMORY {
    ZP:   start = $0080, size = $0080, type = rw, define = yes;
    FONT: start = $2000, size = $0200, type = rw, file = "build/font.bin";
    OT0:  start = $2200, size = $1E00, type = rw, file = "build/ov_t0.bin";
    OT1:  start = $2200, size = $1E00, type = rw, file = "build/ov_t1.bin";
    OT2:  start = $2200, size = $1E00, type = rw, file = "build/ov_t2.bin";
    OT3:  start = $2200, size = $1E00, type = rw, file = "build/ov_t3.bin";
    OT4:  start = $2200, size = $1E00, type = rw, file = "build/ov_t4.bin";
    OT5:  start = $2200, size = $1E00, type = rw, file = "build/ov_t5.bin";
    OA1:  start = $2200, size = $1E00, type = rw, file = "build/ov_a1.bin";
    OA2:  start = $2200, size = $1E00, type = rw, file = "build/ov_a2.bin";
    OA3:  start = $2200, size = $1E00, type = rw, file = "build/ov_a3.bin";
    OA4:  start = $2200, size = $1E00, type = rw, file = "build/ov_a4.bin";
    OA5:  start = $2200, size = $1E00, type = rw, file = "build/ov_a5.bin";
    OA6:  start = $2200, size = $1E00, type = rw, file = "build/ov_a6.bin";
    OTI:  start = $2200, size = $1E00, type = rw, file = "build/ov_ti.bin";
    OGO:  start = $2200, size = $1E00, type = rw, file = "build/ov_go.bin";
    MAIN: start = $4000, size = $4C00, type = rw, file = "build/main.bin";
    MD1:  start = $8C00, size = $0C00, type = rw, file = "build/mod1.bin";
    MD2:  start = $8C00, size = $0C00, type = rw, file = "build/mod2.bin";
    MD3:  start = $8C00, size = $0C00, type = rw, file = "build/mod3.bin";
    MD4:  start = $8C00, size = $0C00, type = rw, file = "build/mod4.bin";
    MD5:  start = $8C00, size = $0C00, type = rw, file = "build/mod5.bin";
    LD:   start = $9C00, size = $0400, type = rw, file = "build/ldr.bin";
    HI:   start = $9800, size = $0400, type = rw, file = "";
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    FONT:     load = FONT, type = rw;
    TR0:      load = OT0,  type = rw;
    TR1:      load = OT1,  type = rw;
    TR2:      load = OT2,  type = rw;
    TR3:      load = OT3,  type = rw;
    TR4:      load = OT4,  type = rw;
    TR5:      load = OT5,  type = rw;
    AR1:      load = OA1,  type = rw;
    AR2:      load = OA2,  type = rw;
    AR3:      load = OA3,  type = rw;
    AR4:      load = OA4,  type = rw;
    AR5:      load = OA5,  type = rw;
    AR6:      load = OA6,  type = rw;
    TIT:      load = OTI,  type = rw;
    GOV:      load = OGO,  type = rw;
    CODE:     load = MAIN, type = rw;
    MOD1:     load = MD1,  type = rw;
    MOD2:     load = MD2,  type = rw;
    MOD3:     load = MD3,  type = rw;
    MOD4:     load = MD4,  type = rw, optional = yes;
    MOD5:     load = MD5,  type = rw, optional = yes;
    LDR:      load = LD,   type = rw;
    HIBSS:    load = HI,   type = bss;
}
